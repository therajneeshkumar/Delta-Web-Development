<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 10 Learning JavaScript</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- Inline JavaScript Event -->
    <button onclick="console.log('Button was Clicked!!!'); console.log('Apna College');">Click me</button>
    <button onclick="console.log('Photo was liked');">Like this photo</button>

    <!-- External Javascript Event -->
    <button type="button" id="btn">Click here...</button>
    <button class="like">like me 1</button>
    <button class="like">like me 2</button>
    <button class="like">like me 3</button>
    <button class="like">like me 4</button> <hr>

    <div class="activity">
        <h3>Generate a random color</h3>
        <button>Generate Color</button> <br> <br>
        <div class="box">This is your new color</div>
    </div> <hr>
    <p>This is a paragraph.</p>
    <div class="outer"></div> <hr>
    <button class="thisbtn">Click this...</button>
    <div class="thisbox">
        <h1>Use of 'this' in Event Listeners</h1>
        <h3>Let's demo it in elements</h3>
        <p>This is a sample paragraph.</p>
        <button>Click this for me!</button>
    </div> <hr>

    <div class="keyboard">
        <!-- <input type="text" placeholder="Type Something..."> -->
        <input  placeholder="move your character">
        <button>Click me!!</button>
    </div> <hr>

    <form action="/action">
        <input type="text" placeholder="username" id="user">
        <input type="text" placeholder="password" id="pass">
        <button>Register</button>
    </form>
    <hr>
    <h2>My Text Editor</h2>
    <p id="textPara"></p>
    <input type="text" id="text" placeholder="Type Something...">
    <script src="./index.js"></script>

</body>

</html>
